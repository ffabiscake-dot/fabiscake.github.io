<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de Administración · Fabi's Cake</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#E84393">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ================= PANTALLA DE LOGIN ================= -->
<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-card">
    <img src="../assets/logo.jpg" alt="Fabi's Cake" class="login-logo" onerror="this.style.display='none'">
    <h1>Panel de Administración</h1>
    <p class="login-sub">Fabi's Cake</p>

    <label for="login-email">Correo</label>
    <input type="email" id="login-email" placeholder="ffabiscake@gmail.com" required autocomplete="username">

    <label for="login-pass">Contraseña</label>
    <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password">

    <button type="submit" class="btn btn-primary btn-block" id="login-btn">Iniciar sesión</button>
    <p id="login-error" class="login-error" hidden></p>
  </form>
</div>

<!-- ================= APP DE ADMINISTRACIÓN ================= -->
<div id="admin-app" class="admin-app" hidden>

  <header class="admin-header">
    <div class="admin-header-left">
      <span>Fabi's Cake · Admin</span>
    </div>
    <button id="logout-btn" class="btn btn-ghost">Cerrar sesión</button>
  </header>

  <main class="admin-main">

    <!-- Barra de acciones: buscar, filtrar, agregar -->
    <div class="toolbar">
      <input type="search" id="search-input" class="input" placeholder="🔍 Buscar producto...">
      <select id="category-filter" class="input">
        <option value="">Todas las categorías</option>
        <option value="General">General</option>
        <option value="cakes">Cakes personalizados</option>
        <option value="postres">Postres y bufet</option>
        <option value="ramos">Ramos de rosas</option>
        <option value="sorpresas">Entretenimiento y sorpresas</option>
        <option value="decoracion">Decoración con globos</option>
        <option value="hombre">Regalos hombre</option>
        <option value="mujer">Regalos mujer</option>
        <option value="nino">Regalos niño</option>
        <option value="nina">Regalos niña</option>
        <option value="combos_alimentos">Combos de alimentos y bebidas</option>
        <option value="combos_cumple">Combos para cumpleaños</option>
      </select>
      <button id="new-product-btn" class="btn btn-primary">+ Nuevo producto</button>
    </div>

    <div id="loading-indicator" class="loading" hidden>Cargando productos...</div>
    <div id="empty-state" class="empty-state" hidden>No hay productos todavía. Toca "+ Nuevo producto" para crear el primero.</div>

    <!-- Lista/grid de productos -->
    <div id="product-grid" class="product-grid"></div>
  </main>
</div>

<!-- ================= MODAL: CREAR / EDITAR PRODUCTO ================= -->
<div id="product-modal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Nuevo producto</h2>
      <button id="modal-close" class="btn-icon" aria-label="Cerrar">✕</button>
    </div>

    <form id="product-form" class="modal-body">
      <input type="hidden" id="product-id">

      <label for="f-imagen-url">URL de la imagen (Postimages)</label>
      <input type="url" id="f-imagen-url" class="input" placeholder="https://i.postimg.cc/..." required>
      <div style="margin-top: 5px; margin-bottom: 15px;">
        <img id="main-image-preview" class="image-preview" hidden alt="Vista previa" style="max-height: 150px; border-radius: 8px;">
      </div>

      <label for="f-nombre">Nombre</label>
      <input type="text" id="f-nombre" class="input" required maxlength="120">

      <label for="f-descripcion">Descripción</label>
      <textarea id="f-descripcion" class="input" rows="3" maxlength="600"></textarea>

      <div class="form-row">
        <div class="form-col">
          <label for="f-precio">Precio (CUP)</label>
          <input type="number" id="f-precio" class="input" min="0" step="1" required>
        </div>
        <div class="form-col">
          <label for="f-categoria">Categoría</label>
          <select id="f-categoria" class="input" required>
            <option value="General">General</option>
            <option value="cakes">Cakes personalizados</option>
            <option value="postres">Postres y bufet</option>
            <option value="ramos">Ramos de rosas</option>
            <option value="sorpresas">Entretenimiento y sorpresas</option>
            <option value="decoracion">Decoración con globos</option>
            <option value="hombre">Regalos hombre</option>
            <option value="mujer">Regalos mujer</option>
            <option value="nino">Regalos niño</option>
            <option value="nina">Regalos niña</option>
            <option value="combos_alimentos">Combos de alimentos y bebidas</option>
            <option value="combos_cumple">Combos para cumpleaños</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-col">
          <label class="checkbox-label">
            <input type="checkbox" id="f-disponible" checked>
            Disponible
          </label>
        </div>
        <div class="form-col">
          <label class="checkbox-label">
            <input type="checkbox" id="f-destacado">
            Producto destacado
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="delete-product-btn" hidden>Eliminar</button>
        <div class="modal-footer-right">
          <button type="button" class="btn btn-ghost" id="cancel-btn">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="save-btn">Guardar cambios</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- ================= MODAL: CONFIRMAR ELIMINACIÓN ================= -->
<div id="confirm-modal" class="modal-overlay" hidden>
  <div class="modal modal-confirm">
    <h2>¿Eliminar este producto?</h2>
    <p>Esta acción no se puede deshacer. El producto se eliminará permanentemente de Firestore.</p>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
      <button type="button" class="btn btn-danger" id="confirm-delete">Sí, eliminar</button>
    </div>
  </div>
</div>

<!-- ================= TOAST / MENSAJES ================= -->
<div id="toast" class="toast" hidden></div>

<script type="module" src="admin.js"></script>
</body>
</html>
